\* An app that can re-save a date it held from before the mirror's raise (the
\* known limit): every property but StaysFresh is expected to hold still, as
\* the Python twin finds. StaysFresh is in MirrorActivityStaleLowered.cfg,
\* because TLC stops at the first violation. TLC has not been run.
SPECIFICATION Spec
CONSTANTS
    Accounts = {1, 2, 3}
    StaleSaves = TRUE
    Lag = 2
    Jump = 3
    ClockMax = 3
    None = None
INVARIANTS
    TypeOK
PROPERTIES
    RaiseBelowNewest
    Idempotence
    BoundedLag
    NeverLowered
    LeaderKept
    NoLostUpdate
    AllOrNothing
    CancellationSafety
    ConvergesInOnePass
