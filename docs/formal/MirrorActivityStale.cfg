\* An app that can re-save a date it held from before the mirror's raise (the
\* known limit): every property but StaysFresh is expected to hold still, as
\* the Python twin finds. StaysFresh is in MirrorActivityStaleLowered.cfg,
\* because TLC stops at the first violation. TLC 2.19 found no error on 2026-10-10, before
\* WriteBelowNewest was added (the 2026-10-10 report).
SPECIFICATION Spec
CONSTANTS
    Accounts = {1, 2, 3}
    StaleSaves = TRUE
    Lag = 2
    Jump = 3
    ClockMax = 3
    None = None
INVARIANTS
    TypeOK
PROPERTIES
    RaiseBelowNewest
    WriteBelowNewest
    Idempotence
    BoundedLag
    NeverLowered
    LeaderKept
    NoLostUpdate
    AllOrNothing
    CancellationSafety
    ConvergesInOnePass
