\* An app that can re-save a value it held from before the mirror's write (the
\* known limit): these properties are expected to hold still, as the Python twin
\* finds. The two that fail are in MirrorFlagsStaleUndo.cfg, because TLC stops at
\* the first violation. TLC has not been run.
SPECIFICATION Spec
CONSTANTS
    Accounts = {1, 2, 3}
    StaleSaves = TRUE
    None = None
    Conflict = Conflict
INVARIANTS
    TypeOK
PROPERTIES
    Idempotence
    ChangeWins
    NoLostUpdate
    AllOrNothing
    BaseAgreement
    CancellationSafety
    ConvergesInOnePass
