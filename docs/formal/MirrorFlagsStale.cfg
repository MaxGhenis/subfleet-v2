\* An app that can re-save a value it held from before the mirror's write
\* (the known limit): TLC reports NeverUndoSettled violated; the rest hold.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2, a3}
    StaleSaves = TRUE
INVARIANTS
    TypeOK
    ConvergesInOnePass
PROPERTIES
    Idempotence
    ChangeWins
    NoLostUpdate
    AllOrNothing
    BaseAgreement
    CancellationSafety
    NeverUndoSettled
