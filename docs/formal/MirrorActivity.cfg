\* An app whose saves never change the date except by running the session:
\* every property is expected to hold, as the Python twin
\* (tests/mirror_activity_model.py) finds. TLC 2.19 found no error on 2026-10-10, before
\* WriteBelowNewest was added (the 2026-10-10 report).
SPECIFICATION Spec
CONSTANTS
    Accounts = {1, 2, 3}
    StaleSaves = FALSE
    Lag = 2
    Jump = 3
    ClockMax = 6
    None = None
INVARIANTS
    TypeOK
PROPERTIES
    RaiseBelowNewest
    WriteBelowNewest
    Idempotence
    BoundedLag
    NeverLowered
    LeaderKept
    NoLostUpdate
    AllOrNothing
    CancellationSafety
    ConvergesInOnePass
    StaysFresh
