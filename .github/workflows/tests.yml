name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} on macOS
    runs-on: macos-15
    # The release line's suite (6,228 tests, the desktop workspace's included)
    # took 12 min 22 s on Python 3.12 on 2026-09-27; 15 min cancelled 3.14.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
      - run: uv sync --locked --group dev --python '${{ matrix.python }}'
      - name: Build source and wheel distributions
        run: uv build
      - name: Compile native menu bar app without launching
        run: app/build.sh "$RUNNER_TEMP/subfleet-frontend"
      - name: Unit, fake-provider, process, and end-to-end contracts
        run: uv run --no-sync pytest -q
        env:
          SUBFLEET_LIVE: "0"
      # The daemon harnesses (tests/e2e, tests/fake, tests/frontend/test_core_live.py)
      # copy a failed test's state root to /tmp/sf-failed/<test>; the live app test adds
      # the probe's checks, exchanges and outbox under probe/.
      - name: Upload failed tests' state roots
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sf-failed-python-${{ matrix.python }}-attempt-${{ github.run_attempt }}
          path: /tmp/sf-failed
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
