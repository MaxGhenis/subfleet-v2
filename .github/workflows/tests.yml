name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} on macOS
    runs-on: macos-15
    # The release line's suite (6,228 tests, the desktop workspace's included)
    # took 12 min 22 s on Python 3.12 on 2026-09-27; 15 min cancelled 3.14.
    # Retention by archive (#76) adds about 22 minutes: its real-filesystem tests
    # took the 3.14 job to 26.5 minutes on 2026-10-04, and the 2.1.11 integration
    # ran past 30. Raised until those tests are made faster (hub follow-up).
    # On the public runners the suite takes 42 to 49 minutes (one passing job
    # took 48 min 42 s), and on 2026-10-08 two jobs were cancelled at 50 while
    # still running, 97% and 99% through, so their results were lost. A limit on
    # the whole job does not bound a single hung test; per-test timeouts are the
    # hub's follow-up.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
      - run: uv sync --locked --group dev --python '${{ matrix.python }}'
      - name: Build source and wheel distributions
        run: uv build
      - name: Compile native menu bar app without launching
        run: app/build.sh "$RUNNER_TEMP/subfleet-frontend"
      - name: Unit, fake-provider, process, and end-to-end contracts
        # The suite has known timing-sensitive tests (D-2 stop-bound, D-F5
        # stream ordering, the guardian relay race, inspection under load) that
        # fail about once per 45-minute job on the shared macOS runners. A
        # failing first pass re-runs only its failed tests, once. A test that
        # passes on that retry is reported as a warning annotation naming it,
        # never hidden. A test that fails twice fails the job.
        run: |
          set +e
          uv run --no-sync pytest -q -p cacheprovider
          first=$?
          if [ "$first" -eq 0 ]; then exit 0; fi
          if [ "$first" -ne 1 ]; then exit "$first"; fi
          cp .pytest_cache/v/cache/lastfailed flaky-first-pass.json 2>/dev/null || echo "{}" > flaky-first-pass.json
          echo "::group::Re-running the failed tests once"
          failed=$(python -c "import json,pathlib;p=pathlib.Path('.pytest_cache/v/cache/lastfailed');print(len(json.loads(p.read_text())) if p.exists() else 0)")
          if [ "$failed" -eq 0 ] || [ "$failed" -gt 5 ]; then
            echo "::error::$failed failed tests; only 1 to 5 are retried"; exit 1
          fi
          uv run --no-sync pytest -q -p cacheprovider --last-failed --last-failed-no-failures none
          second=$?
          echo "::endgroup::"
          if [ "$second" -eq 0 ]; then
            python -c "import json;[print(f'::warning title=Flaky test passed on retry::{t}') for t in json.load(open('flaky-first-pass.json'))]" 2>/dev/null || true
            echo "::warning::$failed test(s) failed once and passed on retry; see the annotations"
            exit 0
          fi
          exit "$second"
        env:
          SUBFLEET_LIVE: "0"
