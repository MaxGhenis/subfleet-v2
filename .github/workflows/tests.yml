name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} on macOS
    runs-on: macos-15
    # The release line's suite (6,228 tests, the desktop workspace's included)
    # took 12 min 22 s on Python 3.12 on 2026-09-27; 15 min cancelled 3.14.
    # Retention by archive (#76) adds about 22 minutes: its real-filesystem tests
    # took the 3.14 job to 26.5 minutes on 2026-10-04, and the 2.1.11 integration
    # ran past 30. Raised until those tests are made faster (hub follow-up).
    # On the public runners the suite takes 42 to 49 minutes (one passing job
    # took 48 min 42 s), and on 2026-10-08 two jobs were cancelled at 50 while
    # still running, 97% and 99% through, so their results were lost. A limit on
    # the whole job does not bound a single hung test; per-test timeouts are the
    # hub's follow-up.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
      - run: uv sync --locked --group dev --python '${{ matrix.python }}'
      - name: Install OCR for the rendered-view regressions
        # tests/frontend/test_visual_round_{three,four}.py read rendered approval
        # cards and sidebars with tesseract and fail, not skip, without it.
        run: brew install tesseract
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - name: Build source and wheel distributions
        run: uv build
      - name: Compile native menu bar app without launching
        run: app/build.sh "$RUNNER_TEMP/subfleet-frontend"
      - name: Unit, fake-provider, process, and end-to-end contracts
        run: uv run --no-sync pytest -q
        env:
          SUBFLEET_LIVE: "0"
