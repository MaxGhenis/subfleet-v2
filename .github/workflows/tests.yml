name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# macOS minutes cost far more than Linux minutes on this private repository, so
# the Python matrix runs on Linux and one macOS job, on the deployed Python,
# covers what only macOS can run: the menu bar app and the C-5.3 process
# identity tests (tests/platform_gates.py lists every gate and its reason).
jobs:
  linux:
    name: Python ${{ matrix.python }} on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
      - run: uv sync --locked --group dev --python '${{ matrix.python }}'
      - name: Build source and wheel distributions
        run: uv build
      - name: Unit, fake-provider, process, and end-to-end contracts
        run: uv run --no-sync pytest -q -rs
        env:
          SUBFLEET_LIVE: "0"

  macos:
    name: Python 3.14 on macOS
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
      - run: uv sync --locked --group dev --python '3.14'
      - name: Compile native menu bar app without launching
        run: app/build.sh "$RUNNER_TEMP/subfleet-frontend"
      - name: Unit, fake-provider, process, and end-to-end contracts
        run: uv run --no-sync pytest -q -rs
        env:
          SUBFLEET_LIVE: "0"
          # A macOS-only test that cannot run here fails instead of skipping:
          # this job is the only place those tests run.
          SUBFLEET_REQUIRE_MACOS_TESTS: "1"
