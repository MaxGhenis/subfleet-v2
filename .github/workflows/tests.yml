name: Tests

# MEASUREMENT PROBE 2, round 3, not for merge (CI cost review, 2026-10-01): ten samples
# of PR #94's final layout (tree 7a85d311), five per interpreter, without the app compile.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: final ${{ matrix.python }} sample ${{ matrix.sample }}
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
        sample: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
      - run: uv sync --locked --group dev --python '${{ matrix.python }}'
      - name: Suite
        run: |
          status=0
          uv run --no-sync pytest -q -rfE -n auto -m "not serial" || status=$?
          uv run --no-sync pytest -q -rfE -m serial || { rc=$?; [ "$rc" -eq 5 ] || status=$rc; }
          exit "$status"
        env:
          SUBFLEET_LIVE: "0"
