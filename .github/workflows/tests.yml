name: Tests

# MEASUREMENT PROBE, not for merge: which tests pass on Linux, and how much
# pytest-xdist shortens the suite on each runner (CI cost review 2026-09-30).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux 3.12 serial", os: ubuntu-24.04, python: "3.12", xdist: "" }
          - { name: "Linux 3.14 serial", os: ubuntu-24.04, python: "3.14", xdist: "" }
          - { name: "Linux 3.14 xdist", os: ubuntu-24.04, python: "3.14", xdist: "-n auto" }
          - { name: "macOS 3.14 xdist", os: macos-15, python: "3.14", xdist: "-n auto" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
      - run: uv sync --locked --group dev --python '${{ matrix.python }}'
      - name: Runner shape
        run: |
          uname -a
          python3 -c 'import os; print("cpus", os.cpu_count())'
      - name: Build source and wheel distributions
        run: uv build
      - name: Compile native menu bar app without launching
        if: runner.os == 'macOS'
        run: app/build.sh "$RUNNER_TEMP/subfleet-frontend"
      - name: Suite
        run: |
          if [ -n "${{ matrix.xdist }}" ]; then
            uv run --no-sync --with 'pytest-xdist==3.8.0' pytest -q -rfEs --durations=60 ${{ matrix.xdist }}
          else
            uv run --no-sync pytest -q -rfEs --durations=60
          fi
        env:
          SUBFLEET_LIVE: "0"
