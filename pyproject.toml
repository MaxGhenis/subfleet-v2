[project]
name = "subfleet"
version = "2.0.0a0"
description = "Dispatch delegated agent work across several Claude and Codex subscriptions from one supervised daemon."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
subfleet = "subfleet.cli:main"
subfleetd = "subfleet.daemon:main"
subfleet-guardian = "subfleet.guardian:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subfleet"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
